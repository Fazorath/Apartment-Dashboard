# Roommate Dash: the app, a pinned local MongoDB and a nightly dump.
#   cp deploy.env.example <secrets path>/app.env   (fill it in, chmod 600)
#   DATA_DIR=... APP_ENV_FILE=<secrets path>/app.env docker compose up -d --build
name: roommate-dash

services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-./.env.production}
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8457}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  mongo:
    image: mongo:8.0.38
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:?set DATA_DIR to the host folder for database data and dumps}/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  mongo-backup:
    image: mongo:8.0.38
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    # Dumps at start, then every night at 03:00 UTC
    entrypoint:
      - sh
      - -c
      - |
        sh /backup.sh || echo "backup failed" >&2
        while true; do
          now=$$(date -u +%s)
          wait=$$(( (86400 + 10800 - now % 86400) % 86400 ))
          [ "$$wait" -eq 0 ] && wait=86400
          sleep "$$wait"
          sh /backup.sh || echo "backup failed" >&2
        done
    networks: [internal]

networks:
  internal:
