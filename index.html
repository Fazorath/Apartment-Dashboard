  <!-- Toast Snackbar -->
  <div id="toast" class="toast" style="display:none;position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:1000;"></div>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Tasks Dashboard</title>
  <!-- Optional utility classes; we don’t rely on @apply -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body class="app dark">
  <div class="container">
    <header class="header">
      <div>
        <h1 class="title">412 Dashboard</h1>
        <p class="subtitle">Recurring chores with last-done dates & due status.</p>
      </div>
      <div class="actions">
        <button id="addTaskBtn" class="btn">➕ Add Task</button>
        <button id="settingsBtn" class="btn" title="Settings">⚙️ Settings</button>
  <!-- Settings Modal (Card Style) -->
  <dialog id="settingsModal" class="dialog card settings-modal">
    <form method="dialog" style="min-width:300px;">
      <div class="dialog-head">
        <h2 class="dialog-title">Settings</h2>
      </div>
      <div class="dialog-body settings-body">
        <div class="settings-row">
          <span class="settings-label">🎨 <span>Accent Color</span></span>
          <input id="accentColorPicker" type="color" class="accent-picker" title="Pick accent color" />
        </div>
        <div class="settings-row">
          <span class="settings-label">🌓 <span>Theme</span></span>
          <button id="themeBtn" type="button" class="btn">Toggle</button>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="submit" class="btn">Close</button>
      </div>
    </form>
  </dialog>
      </div>
    </header>

    <!-- Stats -->
    <section class="stats">
      <div class="card">
        <div class="muted">Overdue</div>
        <div id="statOverdue" class="stat-num">0</div>
      </div>
      <div class="card">
        <div class="muted">Due in 2 days</div>
        <div id="statSoon" class="stat-num">0</div>
      </div>
      <div class="card">
        <div class="muted">Total Active</div>
        <div id="statTotal" class="stat-num">0</div>
      </div>
    </section>

    <!-- Filters -->
    <section class="toolbar card">
      <div class="toolbar-left">
        <button data-filter="all" class="filterBtn btn">All</button>
        <button data-filter="overdue" class="filterBtn btn">Overdue</button>
        <button data-filter="soon" class="filterBtn btn">Due Soon</button>
        <button data-filter="ok" class="filterBtn btn">OK</button>
        <button data-filter="completed" class="filterBtn btn">Completed</button>
      </div>
      <div class="toolbar-right">
  <input id="searchInput" type="search" placeholder="Search tasks…" class="input" />
  <button id="markAllDoneBtn" class="btn" title="Mark all active tasks as done">Mark All Done</button>
  <button id="clearCompletedBtn" class="btn" title="Clear all completed tasks">Clear Completed</button>
  <button id="resetBtn" class="btn">Reset</button>
      </div>
    </section>

    <!-- Task list -->
    <section id="taskList" class="list"></section>

    <footer class="footer muted">
      Local-first. Data lives in your browser. Tip: ⌘/Ctrl + D marks the first task done.
    </footer>
  </div>

  <!-- Modal -->
  <dialog id="taskModal" class="dialog card">
    <form id="taskForm" method="dialog">
      <div class="dialog-head">
        <h2 id="modalTitle" class="dialog-title">Add Task</h2>
      </div>
      <div class="dialog-body">
        <label class="field">
          <span class="label">Name</span>
          <input name="name" required class="input">
        </label>
        <label class="field">
          <span class="label">Assigned To</span>
          <input name="assignedTo" class="input" placeholder="Roommate name (optional)">
        </label>
        <label class="field">
          <span class="label">Frequency (days)</span>
          <input name="frequencyDays" type="number" min="1" step="1" required class="input">
        </label>
        <label class="field">
          <span class="label">Last done</span>
          <input name="lastDone" type="date" class="input">
        </label>
        <label class="field">
          <span class="label">Notes (optional)</span>
          <textarea name="notes" rows="2" class="input"></textarea>
        </label>
        <div class="toggles">
          <label class="check"><input name="pinned" type="checkbox"> Pinned</label>
          <label class="check"><input name="active" type="checkbox" checked> Active</label>
        </div>
      </div>
      <div class="dialog-foot">
        <!-- These values make method='dialog' close the modal with returnValue -->
  <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button id="saveBtn" type="submit" value="save" class="btn primary">Save</button>
      </div>
      <input type="hidden" name="id">
    </form>
  </dialog>

  <template id="taskCardTpl">
    <div class="card item">
      <div class="item-top">
        <div class="item-main">
          <div class="item-line">
            <h3 class="name"></h3>
            <span class="tag statusTag"></span>
            <span class="tag pinnedTag hidden">Pinned</span>
            <span class="tag completedTag hidden">Completed today</span>
          </div>
          <div class="muted details"></div>
          <div class="xsmall assignment"></div>
          <div class="xsmall history"></div>
          <div class="xsmall notes hidden"></div>
        </div>
        <div class="item-actions">
          <button class="btn markBtn" title="Mark Done" aria-label="Mark Done">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="9" stroke="var(--primary)" stroke-width="2"/><path d="M6 10.5l2.5 2.5L14 7.5" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn editBtn" title="Edit" aria-label="Edit">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 13.5V16h2.5l7.1-7.1a1 1 0 0 0 0-1.4l-2.1-2.1a1 1 0 0 0-1.4 0L4 13.5z" stroke="var(--primary)" stroke-width="2"/><path d="M12.5 6.5l1.5 1.5" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="btn danger deleteBtn" title="Delete" aria-label="Delete">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="6" width="10" height="9" rx="2" stroke="#ef4444" stroke-width="2"/><path d="M8 9v4M12 9v4" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><path d="M3 6h14" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><path d="M8 3h4" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </template>

  <script src="./script.js" type="module"></script>
</body>
</html>
